services:
  db:
    image: postgres:16-alpine
    container_name: barbershop-db
    # Credentials come from the root .env file (see .env.example)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  # Local SMTP server that catches every email; inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: barbershop-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    container_name: barbershop-backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Inside the compose network the database and SMTP hosts are the services
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}"]'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: barbershop-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
